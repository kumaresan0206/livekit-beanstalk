version: 0.2

phases:
  pre_build:
    commands:
      - echo Validating script permissions and deployment files
      - chmod +x entrypoint.sh
  build:
    commands:
      - echo Packaging LiveKit deployment bundle for Elastic Beanstalk
      - echo Packaging completed successfully

artifacts:
  files:
    - Dockerfile
    - docker-compose.yml
    - entrypoint.sh
    - livekit.yaml
    - .ebextensions/**/*
  discard-paths: no
