version: 0.2

phases:
  pre_build:
    commands:
      - echo "Validating LiveKit configuration and deployment files..."
      - test -f Dockerfile
      - test -f docker-compose.yml
      - test -f entrypoint.sh
      - test -f livekit.yaml
      - test -d .ebextensions
      - chmod +x entrypoint.sh
  build:
    commands:
      - echo "Packaging LiveKit deployment artifacts..."
      - echo "Build completed successfully."

artifacts:
  files:
    - Dockerfile
    - docker-compose.yml
    - entrypoint.sh
    - livekit.yaml
    - .ebextensions/**/*
  discard-paths: no
