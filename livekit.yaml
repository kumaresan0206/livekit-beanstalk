# ==============================================================================
# LiveKit Server Base Configuration
# ==============================================================================
# Note: The 'keys:' section is omitted here to avoid duplicate YAML mappings.
# It is dynamically appended by entrypoint.sh at container boot using credentials
# fetched from AWS Secrets Manager.
# ==============================================================================

port: 7880
bind_addresses:
  - ""

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
  enable_loopback_candidate: false

logging:
  json: true
  level: info

room:
  auto_create: true
  empty_timeout: 300
  max_participants: 100
